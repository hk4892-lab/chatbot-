[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankbot"
version = "0.1.0"
description = "Multilingual banking support chatbot"
readme = "README.md"
authors = [
  { name = "BankBot Team" }
]
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
pythonpath = ["bankbot"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
